# Nginx reverse proxy — Baby Barn (Ubuntu)
# Install: sudo cp babybarn.conf /etc/nginx/sites-available/babybarn
#          sudo ln -sf /etc/nginx/sites-available/babybarn /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN / YOUR_ADMIN_DOMAIN / server_name as needed.
#
# client_max_body_size must be set on EVERY server that proxies uploads
# (admin posts carousel/product images through /api rewrite). Default nginx
# limit is 1m and will reject large marketing photos before they reach Node.

upstream babybarn_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream babybarn_store {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream babybarn_admin {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Customer storefront
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 25M;

    location / {
        proxy_pass http://babybarn_store;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin console
server {
    listen 80;
    server_name admin.YOUR_DOMAIN YOUR_ADMIN_DOMAIN;

    # Required: admin uploads go admin host → /api rewrite → API
    client_max_body_size 25M;

    location / {
        proxy_pass http://babybarn_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large multipart uploads through Next rewrite
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# API (optional public exposure — or restrict to internal/VPC)
server {
    listen 80;
    server_name api.YOUR_DOMAIN;

    client_max_body_size 25M;

    location / {
        proxy_pass http://babybarn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
